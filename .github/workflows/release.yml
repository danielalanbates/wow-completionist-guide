name: Release
# Manual only. A tag no longer publishes anything: the old BigWigs packager job shipped committed files without the
# generated wiki data and without the provenance gate. Releases are built locally with tools/package_release.py
# (docs/RELEASE.md) and published by hand once Daniel's beta passes. This job only runs the gate tests.
on:
  workflow_dispatch:

jobs:
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release packager gate tests
        run: python3 tools/test_package.py
